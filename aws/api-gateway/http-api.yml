AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS HTTP API - Fase 4 AndesStay
  JWT Authorizer (Azure AD / Microsoft Entra ID), CORS y rutas publicas/protegidas.

Parameters:
  TenantId:
    Type: String
    Default: cb0b9f53-0ba7-4f09-8da2-c2f5ab4b73ee
    Description: Tenant ID (Entra ID) de AndesStay EP1/EP2
  ApiClientId:
    Type: String
    Default: 4cd6df9a-e2f7-4024-aea6-dd67c49709bc
    Description: >
      Application (client) ID registrado en la app de Entra ID.
      El audience esperado sera: ${ApiClientId}
  ApiId:
    Type: String
    Default: lmv59t05gg
    Description: ID del HTTP API existente. No se crea un API nuevo.
  CreateNewApi:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Solo para laboratorios nuevos; por defecto se reutiliza ApiId.
  StageName:
    Type: String
    Default: prod
    Description: Nombre del stage existente
  BffUrl:
    Type: String
    Default: "http://<EC2_PUBLIC_IP>:8080"
    Description: >
      URL base del Backend-for-Frontend al que el API Gateway reenvia las
      peticiones, sin ruta ni sufijo /{proxy}. Sobrescribir con la Elastic IP
      vigente al desplegar.
  AllowedOriginLocal:
    Type: String
    Default: "http://localhost:4200"
    Description: Origen CORS para el frontend Angular local
  AllowedOriginPublic:
    Type: String
    Default: "https://<FRONTEND_DOMAIN>"
    Description: >
      Origen CORS HTTPS del frontend servido por Caddy. Debe coincidir con
      FRONTEND_DOMAIN, exacto y sin barra final.

Conditions:
  ShouldCreateApi: !Equals [!Ref CreateNewApi, "true"]

Resources:

  # =============================
  # HTTP API (AWS API Gateway V2)
  # =============================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: ShouldCreateApi
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: andesstay-http-api
      Description: HTTP API publico de AndesStay - autenticacion JWT centralizada via Microsoft Entra ID
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOriginLocal
          - !Ref AllowedOriginPublic
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowCredentials: false
        MaxAge: 3600

  # =============================
  # JWT Authorizer (Entra ID)
  # =============================
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      Name: andesstay-jwt-entra
      JwtConfiguration:
        Issuer: !Sub "https://login.microsoftonline.com/${TenantId}/v2.0"
        Audience:
          - !Ref ApiClientId

  # =============================
  # Integraciones (HTTP Proxy -> BFF en EC2)
  # =============================
  BffIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      IntegrationType: HTTP_PROXY
      IntegrationUri: !Ref BffUrl
      IntegrationMethod: ANY
      RequestParameters:
        "overwrite:path": $request.path
      PayloadFormatVersion: "1.0"
      TimeoutInMillis: 30000

  # =============================
  # Rutas
  # =============================

  # --- Public Check ---
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/health
      AuthorizationType: NONE
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  HealthRouteReservations:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/reservations/health
      AuthorizationType: NONE
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  # --- Protegidas (requieren JWT + scopes) ---

  GetReservationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/reservations
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  PostReservationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: POST /api/reservations
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  GetReservationByIdRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/reservations/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  UpdateReservationStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: PUT /api/reservations/{id}/status
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  UpdateReservationPreparationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: PUT /api/reservations/{id}/preparation
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/me
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  CatalogListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/catalog/units
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  CatalogCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: POST /api/catalog/units
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  CatalogUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: PUT /api/catalog/units/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  CatalogHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/catalog/health
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  CatalogProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/catalog/{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  AuditProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      RouteKey: GET /api/audit/{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Join ["/", ["integrations", !Ref BffIntegration]]

  # Catch-all: require JWT (no anonymous default)
  # DefaultRoute eliminado para exigir JWT en rutas no explícitas

  # =============================
  # Stage (auto-deploy)
  # =============================
  ProdStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
      StageName: !Ref StageName
      AutoDeploy: true

Outputs:
  ApiIdUsed:
    Description: ID del HTTP API reutilizado o creado
    Value: !If [ShouldCreateApi, !Ref HttpApi, !Ref ApiId]
  HttpApiEndpoint:
    Description: URL base del HTTP API usada por el frontend (incluye /api)
    Value: !If
      - ShouldCreateApi
      - !Sub "${HttpApi.ApiEndpoint}/${StageName}/api"
      - !Sub "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api"
  CorsAllowedOrigin:
    Description: Origen HTTPS permitido por CORS
    Value: !Ref AllowedOriginPublic
  JwtAuthorizerId:
    Description: ID del JWT Authorizer (necesario para agregar rutas futuras)
    Value: !Ref JwtAuthorizer
