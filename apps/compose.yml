name: andesstay

services:

  postgres-db:
    image: postgres:16-alpine
    container_name: andesstay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: andesstay_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d andesstay_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  ms-reservations:
    build:
      context: ../../andesstay-ms-reservations/reservations
      dockerfile: Dockerfile
    image: andesstay/ms-reservations:latest
    container_name: andesstay-ms-reservations
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/reservations/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  ms-catalog:
    build:
      context: ../../andesstay-ms-catalog
      dockerfile: Dockerfile
    image: andesstay/ms-catalog:latest
    container_name: andesstay-ms-catalog
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend-net

  ms-audit:
    build:
      context: ../../andesstay-ms-audit
      dockerfile: Dockerfile
    image: andesstay/ms-audit:latest
    container_name: andesstay-ms-audit
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/api/audit/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  ms-bff:
    build:
      context: ../../andesstay-ms-bff
      dockerfile: Dockerfile
    image: andesstay/ms-bff:latest
    container_name: andesstay-ms-bff
    restart: unless-stopped
    environment:
      MS_RESERVATIONS_URL: http://ms-reservations:8082
      MS_CATALOG_URL: http://ms-catalog:8081
      MS_AUDIT_URL: http://ms-audit:8084
    depends_on:
      ms-reservations:
        condition: service_healthy
      ms-catalog:
        condition: service_started
      ms-audit:
        condition: service_started
    networks:
      - backend-net
      - gateway-net
    ports:
      - "${BFF_PUBLIC_HOST:-127.0.0.1}:${BFF_PORT:-8080}:8080"

networks:
  backend-net:
    driver: bridge
    internal: true
  gateway-net:
    driver: bridge

volumes:
  postgres_data:
