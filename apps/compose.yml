name: andesstay

services:

  postgres-db:
    image: postgres:16-alpine
    container_name: andesstay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: andesstay_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d andesstay_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  ms-reservations:
    build:
      context: ../../andesstay-ms-reservations/reservations
      dockerfile: Dockerfile
    image: andesstay/ms-reservations:latest
    container_name: andesstay-ms-reservations
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/reservations/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  ms-catalog:
    build:
      context: ../../andesstay-ms-catalog
      dockerfile: Dockerfile
    image: andesstay/ms-catalog:latest
    container_name: andesstay-ms-catalog
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  ms-audit:
    build:
      context: ../../andesstay-ms-audit
      dockerfile: Dockerfile
    image: andesstay/ms-audit:latest
    container_name: andesstay-ms-audit
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/api/audit/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  ms-notify:
    build:
      context: ../../andesstay-ms-notify
      dockerfile: Dockerfile
    image: andesstay/ms-notify:latest
    container_name: andesstay-ms-notify
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/api/notify/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - backend-net

  ms-rabbit-admin:
    build:
      context: ../../andesstay-ms-rabbit-admin
      dockerfile: Dockerfile
    image: andesstay/ms-rabbit-admin:latest
    container_name: andesstay-ms-rabbit-admin
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: andesstay-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Mode:'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: andesstay-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  rabbitmq-1:
    image: rabbitmq:3.12-management
    container_name: andesstay-rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
    networks:
      - backend-net
      - gateway-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  rabbitmq-2:
    image: rabbitmq:3.12-management
    container_name: andesstay-rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        /usr/local/bin/docker-entrypoint.sh rabbitmq-server &
        RABBIT_PID=$$!
        gosu rabbitmq bash -c '
          until rabbitmq-diagnostics -q ping >/dev/null 2>&1; do sleep 3; done
          if rabbitmqctl cluster_status 2>/dev/null | grep -q "rabbit@rabbitmq-1"; then
            echo "[cluster] rabbitmq-2 ya forma parte del cluster."
          else
            rabbitmqctl stop_app
            rabbitmqctl reset
            rabbitmqctl join_cluster rabbit@rabbitmq-1
            rabbitmqctl start_app
            echo "[cluster] rabbitmq-2 unido a rabbit@rabbitmq-1."
          fi
        '
        wait "$$RABBIT_PID"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  ms-bff:
    build:
      context: ../../andesstay-ms-bff
      dockerfile: Dockerfile
    image: andesstay/ms-bff:latest
    container_name: andesstay-ms-bff
    restart: unless-stopped
    environment:
      MS_RESERVATIONS_URL: http://ms-reservations:8082
      MS_CATALOG_URL: http://ms-catalog:8081
      MS_AUDIT_URL: http://ms-audit:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      ms-reservations:
        condition: service_healthy
      ms-catalog:
        condition: service_healthy
      ms-audit:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - backend-net
      - gateway-net
    ports:
      - "${BFF_PUBLIC_HOST:-127.0.0.1}:${BFF_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  backend-net:
    driver: bridge
    internal: true
  gateway-net:
    driver: bridge

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  rabbitmq1_data:
  rabbitmq2_data:
